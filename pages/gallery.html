<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Proyek</title>
    <link rel="stylesheet" href="../styles/gallery.css">
</head>
<body>

            <h2>Galeri Proyek</h2>

            </article>

            <article class="gallery-item">

            </article>

            <article class="gallery-item">
                <img src="../assets/images/christmas-poster.png" alt="Poster acara gereja bertema pink">

                <img src="../assets/images/picture-4.jpeg" alt="Seorang perempuan yang ceria">
