<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Kontak</title>
    <style>
        body {
            background-color: #f1dafd;
            font-family: "Poppins", Arial, Helvetica, sans-serif;
            color: #243143;
            margin:0;
        }

        #contact {
            padding: 40px 20px; /*  padding 40px atas-bawah dan 20px kiri-kanan */
        }

        .contact-form {
            width: 400px;
            max-width: 100%;
            margin: 0 auto;
            padding: 24px;
            border: 1px solid #8690b4;
            border-radius: 10px;
            background-color: #ffffff;
            box-sizing: border-box;
        }

        .contact-form h2 {
            text-align: center;
            color: #3a2785;
            margin-top: 0px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea { /*grouping dan descendant*/
            width: 100%;
            padding: 10px;
            border: 1px solid #c5cde4;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            background-color: #d5dff3;
            border-color: #304c9f;
        }

        .form-group textarea:focus {
            background-color: #fff8df;
            border-color: #f7ae2f;
        }


        .btn-submit {
            background-color: #29185b;
            color: #ffffff;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #8235ae;
        }

        .back-link {
            display:block;
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    

    <section id="contact">
        <form class="contact-form" action="#" method="get">
    
        <h2>Hubungi Saya</h2>
        <div class="form-group">
            <label for="name">Nama</label>
            <input type="text" id="name" name="name">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
        </div>

        <div class="form-group">
            <label for="message">Pesan</label>
            <textarea id="message" name="message" rows="4"></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pesan</button>
        </form>

        <a class="back-link" href='../index.html'>Kembali ke Beranda</a>
    </section>

</body>
</html>
